name: spendwise
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.1.0
  drift: ^2.32.0
  sqlite3_flutter_libs: ^0.6.0+eol
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  intl: ^0.20.2
  uuid: ^4.5.3
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
  local_auth: ^3.0.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  csv: ^7.2.0
  shared_preferences: ^2.5.4
  google_fonts: ^8.0.2
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.2
  flutter_svg: ^2.2.4
  gap: ^3.0.1
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  build_runner: ^2.12.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon_1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0F0C29"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/